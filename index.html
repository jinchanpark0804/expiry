<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F6F3EF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>유통기한 정리</title>
<style>
  :root{
    --bg:#F6F3EF; --card:#FFF; --ink:#241F1C; --dim:#8A7F77;
    --line:#E2DAD2; --go:#1F7A5C; --go2:#155A43; --hot:#C2451E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);overflow-x:hidden;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
    font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;
  }
  .pane{display:none;min-height:100dvh;overflow-x:clip;padding:18px 16px calc(20px + env(safe-area-inset-bottom));flex-direction:column}
  .pane.on{display:flex}
  button,input{font-family:inherit;color:var(--ink)}

  /* ===== 홈 ===== */
  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .top h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.02em}
  .top h1 #ver{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:0}
  .top .n{font-size:15px;color:var(--dim);font-weight:600}
  .big{
    flex:1;min-height:34vh;margin:18px 0;border:none;border-radius:26px;background:var(--go);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font-size:clamp(24px,7.5vw,32px);font-weight:800;letter-spacing:-.02em;box-shadow:0 10px 0 var(--go2);
  }
  .big:active{transform:translateY(5px);box-shadow:0 5px 0 var(--go2)}
  .big svg{width:min(74px,18vw);height:min(74px,18vw);stroke:#fff;stroke-width:6;fill:none;stroke-linecap:round}
  .big small{font-size:15px;font-weight:500;opacity:.85;padding:0 18px;text-align:center}
  .send{
    width:100%;padding:20px;border-radius:18px;border:2px solid var(--ink);background:#fff;
    font-size:19px;font-weight:700;margin-bottom:10px
  }
  .send:disabled{border-color:var(--line);color:#BDB4AC}
  .warnbar{
    background:#FFF1EC;border:2px solid var(--hot);border-radius:16px;padding:14px 16px;margin-bottom:12px;
    font-size:15px;font-weight:600;color:#8C2F13;line-height:1.6;display:none
  }
  .warnbar.on{display:block}
  .warnbar b{color:var(--hot)}
  .flat{
    width:100%;padding:12px;border:none;background:none;color:var(--dim);
    font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px
  }

  /* ===== 입력 ===== */
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .bar button{border:none;background:none;font-size:17px;font-weight:700;color:var(--dim);padding:6px 2px}
  .bar .t{flex:1;text-align:center;font-size:17px;font-weight:700}
  .bar .sp{width:52px}
  .tag{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:14px;
    font-size:15px;font-weight:700;word-break:break-all;font-variant-numeric:tabular-nums
  }
  .tag em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:3px}
  .q{font-size:17px;font-weight:700;margin:0 2px 8px}
  input[type=text]{width:100%;padding:14px 12px;border:2px solid var(--line);border-radius:14px;
    background:#fff;font-size:17px;font-weight:600}
  input[type=text]:focus{outline:none;border-color:var(--go)}
  .phint{margin:7px 2px 0;font-size:14px;font-weight:600;color:var(--go);min-height:20px}
  .phint.miss{color:var(--dim)}
  .cand{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .cand button{padding:10px 12px;border:1px dashed var(--line);background:#fff;border-radius:12px;
    font-size:14px;font-weight:600;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  input[type=date]{
    width:100%;padding:16px 12px;border:2px solid var(--line);border-radius:16px;background:#fff;
    font-size:clamp(20px,6vw,24px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums
  }
  input[type=date]:focus{outline:none;border-color:var(--go)}
  .chips{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;margin-top:10px;align-items:center}
  .chips .rl{font-size:17px;font-weight:700;color:var(--dim);padding:0 6px 0 2px;white-space:nowrap}
  .chips button{width:100%;padding:15px 0;border:1px solid var(--line);background:#fff;border-radius:14px;
    font-size:27px;font-weight:600;line-height:1;color:var(--go)}
  .chips button:active{background:#EFE9E2}
  .chips button:active{background:#EFE9E2}
  .left{margin:9px 2px 0;font-size:15px;font-weight:700;color:var(--dim);min-height:22px}
  .left.warn{color:var(--hot)}
  .left i{font-style:normal;font-weight:700}
  .qty{display:flex;align-items:center;gap:12px;margin-top:6px}
  .qty button{width:min(84px,22vw);height:min(84px,22vw);flex:none;border:2px solid var(--line);background:#fff;border-radius:24px;font-size:38px;font-weight:600;line-height:1}
  .qty button:active{background:#EFE9E2}
  .qty input{
    flex:1 1 0;width:0;min-width:0;height:min(84px,22vw);text-align:center;
    font-size:clamp(28px,9vw,38px);font-weight:800;
    border:2px solid var(--line);border-radius:24px;background:#fff;font-variant-numeric:tabular-nums
  }
  .spacer{flex:1;min-height:12px}
  .ok{
    width:100%;padding:21px;border:none;border-radius:20px;background:var(--go);color:#fff;
    font-size:21px;font-weight:800;box-shadow:0 8px 0 var(--go2)
  }
  .ok:active{transform:translateY(4px);box-shadow:0 4px 0 var(--go2)}

  /* ===== 목록 ===== */
  .item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:flex;gap:10px;align-items:center}
  .item .c{flex:1;min-width:0}
  .item .b{font-size:15px;font-weight:700;word-break:break-all;font-variant-numeric:tabular-nums}
  .item .m{font-size:14px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
  .item .x{width:44px;height:44px;flex:none;border:none;background:#F1EBE4;border-radius:12px;font-size:20px;color:var(--dim)}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .none{color:var(--dim);text-align:center;padding:40px 0;font-size:16px}

  /* ===== 카메라 (화면 크기에 맞춰 자동 배치) ===== */
  #cam{position:fixed;inset:0;background:#000;z-index:50;display:none}
  #cam.on{display:block}
  #cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .ovl{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))
  }
  .aimwrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
  .aim{
    width:min(78vw,58vh);height:calc(min(78vw,58vh) * .64);
    border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.62)
  }
  #mark{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #cam.hold .aimwrap{visibility:hidden}
  .ovl.confirm{display:none}
  #cam.hold .ovl.scan{display:none}
  #cam.hold .ovl.confirm{display:flex}
  .cwrap{flex:1;display:flex;align-items:flex-end;justify-content:center;width:100%;min-height:0;padding-bottom:8px}
  .cbox{background:rgba(20,17,15,.9);border:2px solid #3CE08E;border-radius:18px;padding:14px 18px;max-width:100%;text-align:center}
  .cbox em{display:block;font-style:normal;font-size:14px;font-weight:700;color:#9BE9BF;margin-bottom:6px}
  .cnum{color:#fff;font-size:clamp(22px,7vw,30px);font-weight:800;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.25}
  .say{
    color:#fff;font-size:clamp(15px,4.4vw,18px);font-weight:700;text-align:center;
    margin:16px 0 12px;text-shadow:0 2px 6px rgba(0,0,0,.7);flex:none
  }
  .camfoot{width:100%;display:flex;flex-direction:column;gap:10px;flex:none}
  .camfoot button{padding:17px;border:none;border-radius:16px;font-size:17px;font-weight:700}
  .camfoot .a{background:#fff;color:var(--ink)}
  .camfoot .b{background:rgba(255,255,255,.2);color:#fff;font-size:15px;padding:13px}

  .toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:14px 20px;border-radius:999px;font-size:15px;font-weight:700;
    z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;
    display:flex;align-items:center;gap:14px
  }
  .toast.on{opacity:1;pointer-events:auto}
  .toast button{border:none;background:none;color:#FFC46B;font-weight:800;font-size:15px;padding:0}
  #help{position:fixed;inset:0;background:rgba(36,31,28,.94);color:#fff;z-index:80;display:none;
    flex-direction:column;justify-content:center;padding:36px 30px calc(36px + env(safe-area-inset-bottom))}
  #help.on{display:flex}
  #help h2{font-size:24px;margin:0 0 24px;font-weight:800}
  #help p{font-size:18px;line-height:1.75;margin:0 0 14px}
  #help button{margin-top:28px;padding:19px;border:none;border-radius:16px;background:#fff;color:var(--ink);font-size:18px;font-weight:800}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- 홈 -->
<section class="pane on" id="home">
  <div class="top"><h1>유통기한 정리 <span id="ver"></span></h1><div class="n" id="cnt">0개</div></div>
  <div class="warnbar" id="warnbar"></div>
  <button class="big" id="go">
    <svg viewBox="0 0 100 100"><path d="M12 32V16h16M88 32V16H72M12 68v16h16M88 68v16H72M26 50h48"/></svg>
    바코드 찍기
    <small>버튼을 누르고 상자에 대기만 하면 돼요</small>
  </button>
  <button class="send" id="send" disabled>엑셀 파일 내려받기</button>
  <button class="flat" id="openList">저장한 것 보기</button>
  <button class="flat" id="restore">엑셀에서 되살리기</button>
  <input type="file" id="xlpick" accept=".xlsx" style="display:none">
</section>

<!-- 입력 -->
<section class="pane" id="form">
  <div class="bar"><button id="back">← 취소</button><div class="t">언제까지예요?</div><div class="sp"></div></div>
  <div class="tag"><em>바코드</em><span id="codeV">-</span></div>

  <div class="q">제품명</div>
  <input type="text" id="pname" placeholder="제품명" autocomplete="off">
  <div class="phint" id="phint"></div>
  <div class="cand" id="cand"></div>

  <div class="q" style="margin-top:16px">유통기한</div>
  <input type="date" id="date">
  <div class="chips">
    <span class="rl">일자</span>
    <button data-d="-1" aria-label="하루 앞으로">−</button>
    <button data-d="1" aria-label="하루 뒤로">+</button>
    <span class="rl">개월</span>
    <button data-mo="-1" aria-label="한 달 앞으로">−</button>
    <button data-mo="1" aria-label="한 달 뒤로">+</button>
  </div>
  <div class="left" id="left"></div>

  <div class="q" style="margin-top:18px">개수</div>
  <div class="qty">
    <button id="minus">−</button>
    <input type="number" id="qty" value="1" min="0" inputmode="numeric" pattern="[0-9]*">
    <button id="plus">+</button>
  </div>

  <div class="spacer"></div>
  <button class="ok" id="save">저장하고 다음 찍기</button>
  <button class="flat" id="saveStop">저장하고 그만하기</button>
</section>

<!-- 목록 -->
<section class="pane" id="list">
  <div class="bar"><button id="back2">← 뒤로</button><div class="t">저장한 것</div><div class="sp"></div></div>
  <div class="scroll" id="rows"></div>
  <button class="flat" id="wipe" style="color:#C2451E">전부 지우기</button>
</section>

<!-- 카메라 -->
<div id="cam">
  <video id="video" playsinline muted></video>
  <canvas id="mark"></canvas>
  <div class="ovl scan">
    <div class="aimwrap"><div class="aim" id="aim"></div></div>
    <div class="say" id="say">상자 안에 바코드 하나만 넣어 주세요</div>
    <div class="camfoot">
      <button class="a" id="camClose">그만 찍기</button>
      <button class="b" id="camManual">잘 안 읽혀요 · 손으로 입력</button>
    </div>
  </div>
  <div class="ovl confirm">
    <div class="cwrap"><div class="cbox">
      <em>초록 테두리 친 바코드를 읽었어요</em>
      <div class="cnum" id="cnum">-</div>
    </div></div>
    <div class="say">제품에 적힌 숫자와 같은지 봐 주세요</div>
    <div class="camfoot">
      <button class="a" id="cyes">네, 맞아요</button>
      <button class="b" id="cno">아니요 · 다시 찍기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastT"></span><button id="undo" style="display:none">되돌리기</button></div>

<div id="help">
  <h2>이렇게 쓰면 돼요</h2>
  <p>1. 초록 버튼을 누르고 바코드를 비추세요.</p>
  <p>2. 유통기한 날짜와 개수를 고르세요.</p>
  <p>3. 다 끝나면 <b>엑셀 파일 내려받기</b>를 누르세요.</p>
  <button id="helpOk">알겠어요</button>
</div>

const p2=n=>String(n).padStart(2,'0');

function toast(msg,undoFn){
  $('#toastT').textContent=msg;
  const u=$('#undo');
  if(undoFn){u.style.display='';u.onclick=()=>{undoFn();$('#toast').classList.remove('on')}}
  else u.style.display='none';
  const t=$('#toast');t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),undoFn?4000:2000);
}
function show(id){document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===id))}
function refresh(){
  $('#cnt').textContent=rows.length+'개';
  $('#send').disabled=!rows.length;
  const el=$('#rows');
  if(!rows.length){el.innerHTML='<div class="none">아직 저장한 게 없어요</div>';return}
  el.innerHTML=rows.slice().reverse().map(r=>
    '<div class="item"><div class="c"><div class="b">'+esc(r.name||r.code)+'</div>'+
    '<div class="m">'+(r.date||'-')+' · '+r.qty+'개 · '+esc(r.code)+'</div></div>'+
    '<button class="x" data-id="'+r.id+'">×</button></div>').join('');
  el.querySelectorAll('.x').forEach(b=>b.onclick=()=>{
    const i=rows.findIndex(r=>String(r.id)===b.dataset.id);
    if(i<0)return; const gone=rows.splice(i,1)[0]; save(); refresh();
    toast('1개 지웠어요',()=>{rows.splice(i,0,gone);save();refresh()});
  });
}

function cropAim(v){
  const vw=v.videoWidth, vh=v.videoHeight;
  if(!vw||!vh) return null;
  const vr=v.getBoundingClientRect(), ar=document.getElementById('aim').getBoundingClientRect();
  const scale=Math.max(vr.width/vw, vr.height/vh);
  const offX=(vr.width-vw*scale)/2, offY=(vr.height-vh*scale)/2;
  let sx=(ar.left-vr.left-offX)/scale, sy=(ar.top-vr.top-offY)/scale;
  let sw=ar.width/scale, sh=ar.height/scale;
  sx=Math.max(0,Math.min(sx,vw-1)); sy=Math.max(0,Math.min(sy,vh-1));
  sw=Math.min(sw,vw-sx); sh=Math.min(sh,vh-sy);
  if(sw<40||sh<40) return null;
  const k=Math.min(1,1400/Math.max(sw,sh));
  cv.width=Math.round(sw*k); cv.height=Math.round(sh*k);
  cx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
  crop={sx:sx,sy:sy,k:k,scale:scale,offX:offX,offY:offY,left:vr.left,top:vr.top};
  return cv;
}

function startLoop(){
  const v=$('#video');
  if(!det||!stream)return;
  (async function loop(){
    if(!stream||$('#cam').classList.contains('hold'))return;
    try{
      const c=cropAim(v);
      if(c){
        const r=await det.detect(c);
        if(r&&r.length&&r[0].rawValue) return found(r[0].rawValue, r[0].cornerPoints);
      }
    }catch(e){}
    raf=requestAnimationFrame(loop);
  })();
}

async function openCam(){
  $('#cam').classList.add('on'); $('#cam').classList.remove('hold');
  clearMark(); $('#say').textContent='카메라를 켜는 중...';
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  }catch(e){ closeCam(); toast('카메라를 켤 수 없어요'); return; }
  const v=$('#video'); v.srcObject=stream; await v.play();
  sizeMark();
  $('#say').textContent='상자 안에 바코드 하나만 넣어 주세요';
  clearTimeout(tipT);
  tipT=setTimeout(()=>{if(stream&&!$('#cam').classList.contains('hold'))
    $('#say').textContent='천천히 가까이·멀리 움직여 보세요'},7000);

  if('BarcodeDetector' in window){
    let f=FMT; try{const sp=await BarcodeDetector.getSupportedFormats();f=FMT.filter(x=>sp.includes(x))}catch(e){}
    det=new BarcodeDetector(f.length?{formats:f}:undefined);
    startLoop();
  }else{
    try{ await loadJs(ZX); zx=new ZXing.BrowserMultiFormatReader();
      zx.decodeFromVideoElement(v,r=>{if(r&&!$('#cam').classList.contains('hold'))found(r.getText(),null)}); }
    catch(e){ $('#say').textContent='자동 인식이 안 되는 폰이에요. 아래 손으로 입력을 눌러 주세요.'; }
  }
}

/* 인식 → 멈추고 확인 받기 */
function found(text,pts){
  pending=String(text).trim();
  cancelAnimationFrame(raf); raf=0; clearTimeout(tipT);
  if(zx){try{zx.reset()}catch(e){}zx=null}
  try{$('#video').pause()}catch(e){}
  drawMark(pts);
  $('#cnum').textContent=pending;
  $('#cam').classList.add('hold');
  if(navigator.vibrate)navigator.vibrate(70);
}
function resume(){
  clearMark(); pending='';
  $('#cam').classList.remove('hold');
  const v=$('#video');
  if(stream){ try{v.play()}catch(e){}
    if(det) startLoop();
    else { try{ zx=new ZXing.BrowserMultiFormatReader();
      zx.decodeFromVideoElement(v,r=>{if(r&&!$('#cam').classList.contains('hold'))found(r.getText(),null)}); }catch(e){} }
    $('#say').textContent='상자 안에 바코드 하나만 넣어 주세요';
  } else openCam();
}
function closeCam(){
  clearTimeout(tipT); cancelAnimationFrame(raf); raf=0;
  if(zx){try{zx.reset()}catch(e){}zx=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  det=null; pending=''; clearMark();
  $('#video').srcObject=null;
  $('#cam').classList.remove('on'); $('#cam').classList.remove('hold');
}
$('#go').onclick=openCam;
$('#camClose').onclick=()=>{closeCam();show('home')};
$('#cno').onclick=resume;
$('#cyes').onclick=()=>{ const c=pending; closeCam(); if(c)startForm(c); };
$('#camManual').onclick=()=>{
  const v=prompt('바코드 아래 숫자를 입력하세요');
  if(v&&v.trim()){closeCam();startForm(v.trim())}
};
window.addEventListener('resize',()=>{ if(stream)sizeMark(); });

/* 입력 */
/* 바코드 → 제품 정보 (내 사전 우선, 없으면 기본 사전) */
function lookup(c){ return (MY[c]||DICT[c]||null); }
/* 코드가 가까운 제품 후보 */
function candidates(c){
  const p=c.slice(0,9), n=parseInt(c,10);
  const all=Object.keys(DICT).concat(Object.keys(MY).filter(k=>!DICT[k]));
  return all.filter(k=>k.slice(0,9)===p&&k!==c)
    .map(k=>[Math.abs(parseInt(k,10)-n),k])
    .sort((a,b)=>a[0]-b[0]).slice(0,3)
    .map(x=>({code:x[1],name:(MY[x[1]]||DICT[x[1]]).n}));
}
function startForm(c){
  code=c; $('#codeV').textContent=c;
  $('#qty').value=1;
  usedLast=!!lastDate;
  $('#date').value=lastDate||today();       /* 처음엔 오늘, 이후엔 직전 날짜 */
  leftDays();

  const hit=lookup(c), ph=$('#phint'), cd=$('#cand');
  cd.innerHTML='';
  if(hit){
    $('#pname').value=hit.n;
    ph.className='phint';
    ph.textContent='자동 입력됨'+(hit.c?' · 공급가 '+hit.c.toLocaleString()+'원':'');
  }else{
    $('#pname').value='';
    ph.className='phint miss';
    const cs=candidates(c);
    ph.textContent=cs.length?'처음 보는 바코드예요. 비슷한 제품:':'처음 보는 바코드예요. 이름을 적어 주세요.';
    cs.forEach(x=>{
      const b=document.createElement('button');
      b.textContent=x.name;
      b.onclick=()=>{$('#pname').value=x.name;$('#pname').focus();};
      cd.appendChild(b);
    });
  }
  show('form');
  const dup=rows.filter(r=>r.code===c).length;
  if(dup)toast('전에 '+dup+'번 찍은 바코드예요');
}
function addMonth(m){                     /* 현재 날짜 기준 개월 가감 */
  const v=$('#date').value||today();
  const d=new Date(v+'T00:00:00'), day=d.getDate();
  d.setDate(1); d.setMonth(d.getMonth()+m);
  d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
  $('#date').value=ymd(d); usedLast=false; leftDays();
}
function addDay(n){
  const v=$('#date').value||today();
  const d=new Date(v+'T00:00:00'); d.setDate(d.getDate()+n);
  $('#date').value=ymd(d); usedLast=false; leftDays();
}
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{
  if(b.dataset.d!==undefined)addDay(+b.dataset.d); else addMonth(+b.dataset.mo);
});
function leftDays(){
  const v=$('#date').value,el=$('#left');el.className='left';
  if(!v){el.textContent='';return}
  const t=new Date();t.setHours(0,0,0,0);
  const n=Math.round((new Date(v+'T00:00:00')-t)/86400000);
  let s;
  if(n<0){s=(-n)+'일 지났어요';el.classList.add('warn')}
  else if(n===0){s='오늘까지예요';el.classList.add('warn')}
  else{s=n+'일 남았어요';if(n<=30)el.classList.add('warn')}
  if(usedLast&&v===lastDate){
    el.classList.add('warn');
    el.innerHTML=esc(s)+' <i>· 직전에 넣은 날짜예요. 다르면 꼭 바꾸세요</i>';
  } else el.textContent=s;
}
$('#date').onchange=()=>{usedLast=false;leftDays()};
const qv=()=>Math.max(0,parseInt($('#qty').value||'0',10)||0);
$('#plus').onclick=()=>$('#qty').value=qv()+1;
$('#minus').onclick=()=>$('#qty').value=Math.max(0,qv()-1);
$('#back').onclick=()=>show('home');

function doSave(){
  const d=$('#date').value;
  if(!d){
    toast('유통기한을 먼저 골라 주세요');
    const el=$('#date'); if(el.showPicker)try{el.showPicker()}catch(e){} else el.focus();
    return false;
  }
  const nm=$('#pname').value.trim();
  const base=DICT[code];
  if(nm && (!base || base.n!==nm)){          /* 손으로 고친 이름은 내 사전에 기억 */
    MY[code]=Object.assign({},base||{},{n:nm}); saveMy();
  }
  const same=rows.find(r=>r.code===code&&r.date===d);
  if(same){ same.qty=(same.qty||0)+qv(); same.name=nm||same.name; same.at=stamp();
            toast('같은 제품·같은 날짜라 합쳤어요 (총 '+same.qty+'개)'); }
  else rows.push({id:Date.now(),code:code,name:nm,date:d,qty:qv(),at:stamp()});
  saveLast(d); save(); refresh();
  if(navigator.vibrate)navigator.vibrate(30);
  return true;
}
$('#save').onclick=()=>{ if(!doSave())return;
  const mine=rows[rows.length-1];
  toast('저장했어요',()=>{rows=rows.filter(r=>r.id!==mine.id);save();refresh();closeCam();show('home')});
  openCam();
};
$('#saveStop').onclick=()=>{ if(!doSave())return; show('home'); toast('저장했어요'); };

/* 목록 */
$('#openList').onclick=()=>{refresh();show('list')};
$('#back2').onclick=()=>show('home');
$('#wipe').onclick=()=>{
  if(!rows.length)return;
  if(confirm(rows.length+'개를 전부 지울까요?\n엑셀로 내려받지 않았으면 되돌릴 수 없어요.')){
    rows=[];save();refresh();toast('전부 지웠어요');
  }
};

/* 엑셀 내려받기 — 유통기한 관리대장 양식 */
const EXJS=['https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
            'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'];
const THIN={style:'thin',color:{argb:'FF808080'}};
const BD={top:THIN,left:THIN,bottom:THIN,right:THIN};

function slotOf(dstr,baseY,baseM){            /* (유통기한월 − 보고월) + 1 */
  const p=dstr.split('-');
  const m=(+p[0]-baseY)*12+(+p[1]-baseM)+1;
  return (m>=1&&m<=5)?m:0;
}
$('#send').onclick=async()=>{
  if(!rows.length)return;
  const btn=$('#send'); btn.disabled=true; btn.textContent='만드는 중...';
  try{
    if(!window.ExcelJS)await loadJs(EXJS);
    const now=new Date(), bY=now.getFullYear(), bM=now.getMonth()+1;
    const yy=String(bY).slice(2), mm=p2(bM);
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet(yy+'.'+mm);
    [1.8,8,16,39.6,11.8,9,8.8,8.8,8.5,9,9,12,12,14.4,12].forEach((w,i)=>ws.getColumn(i+1).width=w);

    ws.mergeCells('M2:M3'); ws.mergeCells('B3:F3');
    ws.mergeCells('E5:F5'); ws.mergeCells('G5:L5');
    const put=(ref,v,opt)=>{const c=ws.getCell(ref); c.value=v; Object.assign(c,opt||{}); return c;};
    put('M2','관리자',{font:{bold:true,size:11},alignment:{horizontal:'center',vertical:'middle'},border:BD});
    put('N2','직급',{font:{bold:true,size:11},alignment:{horizontal:'center'},border:BD});
    put('O2','이름',{font:{bold:true,size:11},alignment:{horizontal:'center'},border:BD});
    put('N3',MGR_TITLE,{alignment:{horizontal:'center'},border:BD});
    put('O3',MGR_NAME,{alignment:{horizontal:'center'},border:BD});
    put('B3',STORE+'  유통기한 관리대장',{font:{bold:true,size:16},alignment:{horizontal:'center'}});
    ws.getRow(3).height=24;
    put('E5','5개월 기준',{font:{bold:true},alignment:{horizontal:'center'}});
    put('G5','남은 수량',{font:{bold:true},alignment:{horizontal:'center'}});

    const head=['순번','바코드','제품명','유통기한','수량','5개월','4개월','3개월','2개월','1개월','공급가','판매가','비고(할인율)','할인판매가'];
    head.forEach((h,i)=>{
      const c=ws.getCell(6,i+2); c.value=h;
      c.font={bold:true}; c.alignment={horizontal:'center',vertical:'middle'};
      c.border=BD; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEFEFEF'}};
    });
    ws.getRow(6).height=20;

    const data=rows.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    data.forEach((r,i)=>{
      const rw=7+i, s=slotOf(r.date,bY,bM);
      const info=MY[r.code]||DICT[r.code]||{};
      const v=[i+1, r.code, r.name||info.n||'', r.date.replace(/-/g,'.'), r.qty,
               s===5?r.qty:null, s===4?r.qty:null, s===3?r.qty:null, s===2?r.qty:null, s===1?r.qty:null,
               s?(info.c||null):null, s?(info.p||null):null, null, null];
      v.forEach((val,j)=>{
        const c=ws.getCell(rw,j+2);
        if(val!==null&&val!=='')c.value=val;
        c.border=BD;
        c.alignment={horizontal:(j===2?'left':'center'),vertical:'middle'};
        if(j===1)c.numFmt='@';
        if(j===10||j===11||j===13)c.numFmt='#,##0';
        if(j===12)c.numFmt='0%';
      });
      ws.getRow(rw).height=18;
    });

    /* 2번째 시트: 제품정보 (백업 겸 기준정보) */
    const ws2=wb.addWorksheet('제품정보');
    [18,42,12,12,14].forEach((w,i)=>ws2.getColumn(i+1).width=w);
    ['바코드','제품명','공급가','판매가','비고'].forEach((h,i)=>{
      const c=ws2.getCell(1,i+1); c.value=h; c.font={bold:true};
      c.alignment={horizontal:'center'}; c.border=BD;
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEFEFEF'}};
    });
    const keys=Object.keys(Object.assign({},DICT,MY)).sort();
    keys.forEach((k,i)=>{
      const v=MY[k]||DICT[k]; const rw=2+i;
      [k,v.n,v.c||null,v.p||null,MY[k]?'직접 입력':''].forEach((val,j)=>{
        const c=ws2.getCell(rw,j+1);
        if(val!==null&&val!=='')c.value=val;
        c.border=BD; c.alignment={horizontal:(j===1?'left':'center')};
        if(j===0)c.numFmt='@';
        if(j===2||j===3)c.numFmt='#,##0';
      });
    });

    const name=STORE+'_'+yy+'_'+mm+'월_유통기한관리대장_매월10일보고_.xlsx';
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('다운로드 폴더에 저장됐어요');
  }catch(e){ console.error(e); toast('만들지 못했어요. 인터넷을 확인해 주세요'); }
  btn.textContent='엑셀 파일 내려받기'; btn.disabled=!rows.length;
};

/* 엑셀에서 되살리기 */
$('#restore').onclick=()=>$('#xlpick').click();
$('#xlpick').onchange=async(e)=>{
  const file=e.target.files[0]; if(!file)return; e.target.value='';
  toast('파일을 읽는 중...');
  try{
    if(!window.ExcelJS)await loadJs(EXJS);
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());

    let nd=0;
    const ws2=wb.getWorksheet('제품정보');
    if(ws2){
      ws2.eachRow((row,i)=>{
        if(i===1)return;
        const bc=String(row.getCell(1).value||'').replace(/\D/g,'');
        const nm=String(row.getCell(2).value||'').trim();
        if(bc.length<8||!nm)return;
        const cur=MY[bc]||DICT[bc];
        if(!cur||cur.n!==nm||!MY[bc]){
          const o={n:nm};
          const c=row.getCell(3).value, p=row.getCell(4).value;
          if(typeof c==='number')o.c=c;
          if(typeof p==='number')o.p=p;
          MY[bc]=o; nd++;
        }
      });
      saveMy();
    }

    let nr=0, found=[];
    wb.eachSheet(ws=>{
      if(!/^\d\d\.\d\d$/.test(ws.name))return;
      ws.eachRow((row,i)=>{
        if(i<7)return;
        const bc=String(row.getCell(3).value||'').replace(/\D/g,'');
        const dt=String(row.getCell(5).value||'').replace(/\./g,'-');
        const qy=row.getCell(6).value;
        if(bc.length<8||!/^\d{4}-\d{2}-\d{2}$/.test(dt))return;
        found.push({code:bc,name:String(row.getCell(4).value||'').trim(),
                    date:dt,qty:typeof qy==='number'?qy:1});
      });
    });

    if(found.length && confirm('제품명 '+nd+'건을 되살렸어요.\n대장에 적힌 기록 '+found.length+'건도 목록으로 되살릴까요?\n\n(이미 있는 건 건너뜁니다)')){
      found.forEach(x=>{
        if(rows.some(r=>r.code===x.code&&r.date===x.date))return;
        rows.push({id:Date.now()+nr,code:x.code,name:x.name,date:x.date,qty:x.qty,at:stamp()});
        nr++;
      });
      save();
    }
    refresh();
    toast('제품명 '+nd+'건'+(nr?' · 기록 '+nr+'건':'')+' 되살렸어요');
  }catch(err){ console.error(err); toast('이 파일은 읽을 수 없어요'); }
};
